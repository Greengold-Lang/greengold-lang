name: Release

# Push a tag `vX.Y.Z` (the version is taken from the tag, nothing to edit) to build the standalone `gg` for every platform
# and publish them as a GitHub release. `gg update` and installer/install.* download these files.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   asset: gg-windows-x64.exe, built: dist/gg.exe }
          - { os: ubuntu-22.04,     asset: gg-linux-x64,       built: dist/gg }
          - { os: ubuntu-22.04-arm, asset: gg-linux-arm64,     built: dist/gg }
          - { os: macos-latest,     asset: gg-macos-arm64,     built: dist/gg }
          - { os: macos-15-intel,   asset: gg-macos-x64,       built: dist/gg }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag ${GITHUB_REF_NAME} is not vX.Y.Z"; exit 1; }
          sed -i.bak -E "s/^__version__ = \".*\"/__version__ = \"$v\"/" greengold/__init__.py
          rm greengold/__init__.py.bak
          grep __version__ greengold/__init__.py
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[standalone,toolchain]"
      - name: Build the single-file gg
        run: python tools/build_standalone.py
      - name: Smoke test
        shell: bash
        run: |
          ${{ matrix.built }} --version
          ${{ matrix.built }} toolchain
          ${{ matrix.built }} run examples/hello.gg
      - name: Name the file
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          v=$(python -c "import greengold; print(greengold.__version__)")
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$v" "//DGgExe=..\dist\gg.exe" installer/greengold.iss
          cp dist/gg-setup-windows-x64.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          sha256sum gg-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Greengold ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md). Install: https://github.com/${GITHUB_REPOSITORY}#install"
      - name: Keep the files (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/*
