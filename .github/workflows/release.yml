name: Release

# Push a tag `vX.Y.Z` (the version is taken from the tag, nothing to edit) to build the standalone `gg` for every platform
# and publish them as a GitHub release. `gg update` and installer/install.* download these archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   asset: gg-windows-x64.zip,     built: dist/gg/gg.exe }
          - { os: ubuntu-22.04,     asset: gg-linux-x64.tar.gz,    built: dist/gg/gg }
          - { os: ubuntu-22.04-arm, asset: gg-linux-arm64.tar.gz,  built: dist/gg/gg }
          - { os: macos-latest,     asset: gg-macos-arm64.tar.gz,  built: dist/gg/gg }
          # No Intel Mac build: llvmlite >= 0.50 ships no macosx x86_64 wheel (it would need a source build against LLVM 22).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag ${GITHUB_REF_NAME} is not vX.Y.Z"; exit 1; }
          sed -i.bak -E "s/^__version__ = \".*\"/__version__ = \"$v\"/" greengold/__init__.py
          rm greengold/__init__.py.bak
          grep __version__ greengold/__init__.py
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[standalone,toolchain]"
      - name: Build the standalone gg folder
        run: python tools/build_standalone.py
      - name: Smoke test
        shell: bash
        run: |
          ${{ matrix.built }} --version
          ${{ matrix.built }} toolchain
          ${{ matrix.built }} run examples/hello.gg
      - name: Pack the folder
        run: python tools/build_standalone.py --pack "out/${{ matrix.asset }}"
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          v=$(python -c "import greengold; print(greengold.__version__)")
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$v" "//DGgDir=..\dist\gg" installer/greengold.iss
          cp dist/gg-setup-windows-x64.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  vsix:
    name: Build the VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package
        working-directory: vscode-extension
        run: |
          npm ci --omit=dev
          # On a tag the extension version is the tag's version, like the compiler's.
          VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          npx --yes @vscode/vsce package $VERSION --no-git-tag-version --out greengold-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: greengold-vscode.vsix
          path: vscode-extension/greengold-vscode.vsix
          if-no-files-found: error
      - name: Package the themes
        working-directory: vscode-themes
        run: npx --yes @vscode/vsce package --no-git-tag-version --out greengold-themes.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: greengold-themes.vsix
          path: vscode-themes/greengold-themes.vsix
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          sha256sum gg-* greengold-vscode.vsix greengold-themes.vsix > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Greengold ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md). Install: https://github.com/${GITHUB_REPOSITORY}#install"
      - name: Keep the files (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/*

  extension-registries:
    name: Publish the extension to the VS Code Marketplace and Open VSX
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: "*.vsix"
          merge-multiple: true
      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          npx --yes @vscode/vsce publish --packagePath greengold-vscode.vsix
          # The themes have their own version; skip it when that version is already published.
          npx --yes @vscode/vsce publish --packagePath greengold-themes.vsix --skip-duplicate
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: |
          npx --yes ovsx publish greengold-vscode.vsix -p "$OVSX_PAT"
          npx --yes ovsx publish greengold-themes.vsix -p "$OVSX_PAT" --skip-duplicate
