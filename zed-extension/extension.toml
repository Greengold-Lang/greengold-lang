id = "greengold"
name = "Greengold"
description = "Greengold (.gg) language support: syntax highlighting, outline, snippets, official themes, file icons and `gg lsp` language server."
version = "0.1.0"
schema_version = 1
authors = ["Greengold Lang"]
repository = "https://github.com/Greengold-Lang/zed-greengold"

snippets = ["./snippets/greengold.json"]

[language_servers.greengold-lsp]
name = "Greengold Language Server"
languages = ["Greengold"]

[language_servers.greengold-lsp.language_ids]
"Greengold" = "gg"

[grammars.gg]
repository = "https://github.com/Greengold-Lang/tree-sitter-gg"
rev = "55ffc049766b1cd43685656fb5b74a8158f78ea4"
